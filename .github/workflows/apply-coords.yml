name: Apply coords
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          cat > pack.b64 <<'PACK'
          
          PACK
          base64 -d pack.b64 | tar xz
          python3 apply_patch.py
          rm -f pack.b64 apply_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coords.json map.html
          git commit -m "Add hospital coordinates from HIRA nationwide facility list (2026.9.30)"
          git push
